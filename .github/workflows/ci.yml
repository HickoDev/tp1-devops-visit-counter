name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test and package
        run: mvn -B -ntp verify
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: target/surefire-reports/
      - name: Build Docker image (also on pull requests)
        run: docker build -t counter-app:ci .

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Hub credentials
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$HUB_USER" && test -n "$HUB_TOKEN" || {
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository secrets.'
            exit 1
          }
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push validated image
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$HUB_USER/counter-app"
          docker build -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
